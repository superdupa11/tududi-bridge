# tududi-bridge configuration
# Copy to config/config.yml and edit. Secrets can also come from env vars
# (NTFY_TOKEN, TUDUDI_API_TOKEN), which take precedence over anything here.

ntfy:
  base_url: http://10.11.10.209:80
  # Only needed for self-hosted ntfy with auth, or ntfy Pro reserved topics.
  # token: tk_xxxxxxxxxxxx
  # Single static topic the planner (below) publishes clarifying questions to
  # and listens for replies on. Same "topic name is a password" rule as
  # topics: below -- use a long random suffix.
  reply_topic: tududi-plan-replies-CHANGEME

tududi:
  base_url: http://10.11.10.227:3002
  token: tt_xxxxxxxxxxxxxxxxxxxx
  # Override if your tududi version moved things. Check the Swagger UI at
  # <base_url>/api/v1 and adjust. {id} is substituted at call time.
  paths:
    create_task: /api/v1/task
    update_task: /api/v1/task/{id}
    list_projects: /api/v1/projects
    list_tasks: /api/v1/tasks
    get_task: /api/v1/task/{id}
  # Query param used to filter list_tasks by tag -- unconfirmed against a
  # live instance, override here if the planner's discover pass 404s.
  tag_query_param: tag

ollama:
  base_url: http://10.11.10.229:11434
  # Sparse MoE is the right shape for CPU inference: 30B of knowledge,
  # ~3B active per token. Falls back well to qwen3:14b if RAM is tight.
  model: qwen3:30b-a3b
  num_ctx: 4096
  num_thread: 8          # PHYSICAL cores. SMT usually hurts llama.cpp.
  seed: 42               # fixed seed -> reproducible triage
  keep_alive: -1         # never unload; an 18GB reload costs minutes
  request_timeout: 900
  # Execution (below) is agentic tool-calling, not 3-pass triage -- it needs
  # far more context than num_ctx above, so these deliberately do NOT
  # inherit it. exec_model falls back to model above if unset; a model sized
  # for CPU triage may perform poorly as a coding agent, so pull a
  # coding-capable model and set exec_model explicitly once you've evaluated one.
  # exec_model: qwen3:30b-a3b
  exec_num_ctx: 32768
  exec_temperature: 0.2

worker:
  poll_interval: 10
  max_attempts: 3
  backoff_base: 120      # seconds; doubles each retry
  stale_after: 1800      # reclaim rows stuck in 'processing'
  # Skip inference while the box is busy (Plex transcode, parity check, mover).
  # 0 disables. On an 8-core box, ~6.0 is a reasonable ceiling.
  load_threshold: 6.0
  # Optional hard window. Omit to run around the clock.
  # quiet_hours: { start: 23, end: 7 }

# ---------------------------------------------------------------------------
# AI planning (tag-triggered, separate from the ntfy-capture pipeline above)
# ---------------------------------------------------------------------------

claude:
  # CLAUDE_CODE_OAUTH_TOKEN is intentionally NOT a key in this file -- it is
  # a container environment variable only (see unraid-template.xml, or set it
  # directly in run.sh's .env). One-time host setup: run `claude setup-token`
  # on a machine with an active Claude subscription (Pro/Max/Team) and put
  # the result there. The planner refuses to start if ANTHROPIC_API_KEY or
  # ANTHROPIC_AUTH_TOKEN is set anywhere in its environment, since Claude
  # Code would otherwise silently prefer that over the token and switch
  # billing to pay-per-token.
  model: claude-opus-5
  cli_timeout: 300
  max_budget_usd: 0.50   # hard per-call spend cap enforced by the CLI itself

github:
  token: ghp_xxxxxxxxxxxxxxxxxxxx   # or GITHUB_TOKEN; read-only fine-grained PAT recommended
  # project_id -> "owner/repo". The planner shallow-clones each mapped repo
  # locally so Claude can read it directly (Read/Grep/Glob) while planning a
  # task in that project. Projects not listed here get no repo grounding.
  repos:
    10: "superdupa11/episort"
    9:  "superdupa11/movienight"
    8:  "superdupa11/manabase-central"
    2:  "superdupa11/manabase-lgs"
    1:  "superdupa11/manabase-upkeep"

planner:
  trigger_tag: plan-me   # tag a task with this in the tududi UI to queue it for planning
  poll_interval: 60
  max_attempts: 3
  backoff_base: 120
  stale_after: 1800
  # Claude runs remotely -- unlike worker.load_threshold above (which guards
  # Ollama's local CPU inference), local box load doesn't gate this by
  # default. 0 disables.
  load_threshold: 0
  # quiet_hours: { start: 23, end: 7 }
  max_clarification_rounds: 3
  awaiting_input_reminder_after: 86400   # re-nudge ntfy after 24h unanswered; 0 disables

# ---------------------------------------------------------------------------
# Agentic execution (tag-triggered, picks up plans the planner already
# finished). Needs container changes beyond config.yml -- see run.sh/
# Dockerfile's "executor" target and unraid-template-executor.xml:
#   - A workspace volume (host dir -> codeserver.workspace_root here) bind-
#     mounted into BOTH this container and your code-server container (at
#     codeserver.workspace_container_root there). Same host path, two
#     containers, so the agent's file changes are visible live in code-server.
#   - For the default "docker" backend: /var/run/docker.sock mounted into
#     this container, so it can `docker exec` into code-server. This grants
#     root-equivalent control of the whole host -- if that's not acceptable,
#     set codeserver.exec_backend: local instead and skip the socket mount
#     (commands then run inside this container itself, which needs each
#     project's toolchain installed, and won't be visible in code-server).
# ---------------------------------------------------------------------------

executor:
  trigger_tag: execute-me   # tag a task with this (after it already has plan:done) to queue it
  poll_interval: 60
  max_attempts: 3
  backoff_base: 120
  stale_after: 1800
  # Unlike planner_load_threshold, this DOES gate on local box load by
  # default -- the agent loop drives the same local Ollama host worker.py
  # uses. 0 disables.
  load_threshold: 0
  # quiet_hours: { start: 23, end: 7 }
  max_steps: 40           # hard cap on agent tool-call turns per run (a paused wait doesn't count)
  step_timeout: 120       # seconds, per `run` shell command
  total_timeout: 3600     # seconds of ACTIVE run time (excludes time spent paused for a reply)
  # `git push` and `docker build`/`docker push` are never automatic -- when
  # allowed at all (below), every attempt pauses the run and asks for a
  # yes/no on that run's own ntfy topic (see "Per-run ntfy conversation"
  # below) instead of executing immediately.
  allow_push: false       # also requires github.token; false hard-denies git push, no approval offered
  allow_docker: false     # also gates the executor's own end-of-run push (see allow_push); separate
  #                         switch from allow_push -- docker build/push is a different capability
  #                         (image builds, not code pushes). false hard-denies docker build/push too.
  # allowed_commands: []  # if non-empty, an allowlist of command prefixes
  # denied_commands: []   # additional denied prefixes, on top of the built-in sudo / rm -rf /
  # notify_topic: ...     # defaults to ntfy.reply_topic above if unset -- used for the one-line
  #                         done/needs-review/failed summary; NOT the per-run conversation, see below
  awaiting_input_reminder_after: 86400   # re-nudge a parked run's own topic after 24h; 0 disables

# ---------------------------------------------------------------------------
# Per-run ntfy conversation: every execution gets its OWN freshly-generated
# topic (e.g. exec-<task_id>-<random>), announced once on the topic mapped
# to the task's project above (or the topic with project_id: null, as a
# triage/inbox fallback, if the task isn't mapped to any project). Reply on
# THAT topic, not the project one, to answer a question or approve/deny a
# push -- any reply on a run's own topic is unambiguous, no prefix needed.
# Approval replies: anything starting with yes/y/approve/ok/go/lgtm counts
# as approval; anything else (including no reply at all) is a denial.
# ---------------------------------------------------------------------------

codeserver:
  exec_backend: docker    # "docker" (exec into code-server) or "local" (run in this container)
  container: code-server  # code-server's container name, for `docker exec`
  workspace_root: /data/workspaces              # path as THIS container sees the shared volume
  workspace_container_root: /config/workspace   # path as code-server sees the SAME volume

# ---------------------------------------------------------------------------
# Optional third sandbox backend for projects that need real Apple tooling
# (Xcode / iOS Simulator) -- structurally impossible inside a Linux
# container, docker or otherwise. Only ever used for the project_ids listed
# under `projects` below, and only for a run where the Mac was reachable
# (a plain TCP check against ssh_port) at that run's very start -- if it
# isn't, that run falls back to codeserver.exec_backend instead and gets a
# clearly-flagged note in both the ntfy conversation and the task itself
# saying Mac-dependent work couldn't be verified. The check doesn't repeat
# mid-run, so a Mac that drops off partway through doesn't switch backends
# under the agent.
#
# The workspace is mirrored (rsync, over SSH) to/from the Mac around every
# command routed there -- needs passwordless (key-based) SSH from this
# container to the Mac, and `rsync`/an account on the Mac side (both ship
# with macOS). Requires openssh-client + rsync in the executor image (already
# in the executor Dockerfile target) and a mounted private key -- see
# run.sh/unraid-template-executor.xml's "Mac SSH Key" entry.
# ---------------------------------------------------------------------------

# mac:
#   enabled: false
#   host: 10.11.10.xxx                      # the Mac's IP/hostname
#   ssh_user: yourname
#   ssh_port: 22
#   ssh_key: /config/mac_ssh_key            # path as the bridge container sees the mounted key
#   workspace_root: /Users/yourname/tududi-workspaces   # synced clones live here, on the Mac
#   connect_timeout: 5      # seconds, the reachability check
#   command_timeout: 900    # seconds, per command AND per rsync pass -- iOS builds are slow
#   projects: [1]            # project_id(s) to route here, e.g. 1 = Manabase Upkeep (Flutter/iOS)

# Topic -> project. The ntfy topic name IS the routing key AND, on ntfy.sh,
# effectively a password -- append random characters to every one of these.
# `notes` is injected into the drafting prompt as PROJECT_NOTES.
topics:
  episort-1lemx7:
    project_id: 10   # EpiSort
    notes: >
      Renames ripped BluRay TV episode files by matching dialogue (embedded
      subtitles or local Whisper transcription) against OpenSubtitles
      references. Python CLI, optional Anthropic API fallback for
      low-confidence matches.
  binger-i7opar:
    project_id: 9    # binger (Movie-Tinder repo)
    notes: >
      Self-hosted movie-night group voting app against a Plex library,
      single Docker container on Unraid. Node 22/TypeScript, Fastify +
      socket.io server, SQLite via better-sqlite3, React + Vite client.
  manabase-central-wo48ti:
    project_id: 8    # Manabase Central
    notes: >
      Public hub server aggregating MTG Commander game stats across
      participating local game stores (LGS); each store's Manabase LGS
      instance syncs into it. Python FastAPI + Jinja2 ("Elderspell" design
      system), SQL Server backend, Docker deployment.
  manabase-lgs-xsa18m:
    project_id: 2    # Manabase LGS
    notes: >
      Commander game stats tracker for a single local game store — players,
      decks, games — that optionally syncs up to Manabase Central. Python
      FastAPI + Jinja2 ("Elderspell" design system), SQL Server backend,
      Docker deployment.
  manabase-upkeep-9fylqb:
    project_id: 1    # Manabase Upkeep
    notes: >
      Flutter companion mobile app for Manabase LGS — tracks Commander
      games on the go (life totals, commander damage, game submission)
      against a store's Manabase LGS server.
  triage-n5b3t8:
    project_id: null      # lands in the tududi inbox
    notes: "Uncategorised capture. Project not yet decided."

# Used when a message arrives on a topic that isn't listed above.
default_project_id: null
