services:
  ingest:
    build: .
    container_name: tududi-ingest
    restart: unless-stopped
    command: python ingest.py
    environment:
      - TZ=America/Chicago
      - TUDUDI_API_TOKEN=${TUDUDI_API_TOKEN}
      # - NTFY_TOKEN=${NTFY_TOKEN}
    volumes:
      - /mnt/user/appdata/tududi-bridge/config:/config:ro
      - /mnt/user/appdata/tududi-bridge/data:/data

  worker:
    build: .
    container_name: tududi-worker
    restart: unless-stopped
    command: python worker.py
    environment:
      - TZ=America/Chicago
      - TUDUDI_API_TOKEN=${TUDUDI_API_TOKEN}
    volumes:
      - /mnt/user/appdata/tududi-bridge/config:/config:ro
      - /mnt/user/appdata/tududi-bridge/data:/data
      - ./prompts:/app/prompts:ro    # live-edit prompts without rebuilding
